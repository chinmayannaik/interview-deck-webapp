<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />

  <title>InterviewDeck — Coding &amp; Interview Questions</title>
  <meta name="description" content="A free, searchable bank of coding and interview questions and answers — Angular, React, JavaScript, TypeScript, Java, Spring Boot, SQL, mobile, DevOps, testing, AI and system design. Practice mode, AI helper, bookmarks and progress tracking." />
  <meta name="keywords" content="interviewdeck, interview deck, interview questions, coding interview, angular interview, react interview, javascript interview, typescript, rxjs, ngrx, frontend interview, java, spring boot, sql, git, flutter interview, android interview, devops interview, testing interview, system design interview, behavioral interview, ai interview" />
  <meta name="author" content="InterviewDeck" />
  <link rel="canonical" href="https://www.interviewdeck.in/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="InterviewDeck" />
  <meta property="og:title" content="InterviewDeck — Coding &amp; Interview Questions" />
  <meta property="og:description" content="Master coding and interview questions - a searchable bank with practice mode, bookmarks and progress tracking." />
  <meta property="og:url" content="https://www.interviewdeck.in/" />
  <meta property="og:image" content="https://www.interviewdeck.in/assets/og-card.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="InterviewDeck — Coding &amp; Interview Questions" />
  <meta name="twitter:description" content="Master coding and interview questions - searchable, with practice mode." />
  <meta name="twitter:image" content="https://www.interviewdeck.in/assets/og-card.png" />

  <!-- Tells Google which name belongs to this site. Both spellings are declared
       because the brand is written solid but read as two words. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.interviewdeck.in/#website",
        "url": "https://www.interviewdeck.in/",
        "name": "InterviewDeck",
        "alternateName": ["Interview Deck", "Interview Deck - Interview Questions Bank"],
        "description": "A free, searchable bank of coding and interview questions and answers.",
        "inLanguage": "en",
        "publisher": { "@id": "https://www.interviewdeck.in/#org" }
      },
      {
        "@type": "Organization",
        "@id": "https://www.interviewdeck.in/#org",
        "name": "InterviewDeck",
        "alternateName": "Interview Deck",
        "url": "https://www.interviewdeck.in/",
        "logo": "https://www.interviewdeck.in/assets/favicon/icon-512.png"
      }
    ]
  }
  </script>

  <!-- icons + manifest -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="assets/favicon/icon-48.png"  type="image/png" sizes="48x48" />
  <link rel="icon" href="assets/favicon/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/favicon/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#C21836" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151213" media="(prefers-color-scheme: dark)" />

  <!-- Webfonts. Cross-origin, so the service worker leaves them to the network;
       offline the stacks in --sans/--mono fall back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- stylesheets (order matters: tokens → reset → components → theme) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/splash.css" />
  <link rel="stylesheet" href="css/dark-theme.css" />
  <link rel="stylesheet" href="css/tutor.css" />
  <link rel="stylesheet" href="css/notebook.css" />
  <link rel="stylesheet" href="css/quicknote.css" />
  <link rel="stylesheet" href="css/dialog.css" />
  <link rel="stylesheet" href="css/speak.css" />
  <link rel="stylesheet" href="css/coding.css" />

  <!-- the splash's own artwork is the only thing it waits on -->
  <link rel="preload" as="image" href="assets/splash-illustration.webp" type="image/webp" />

  <!-- set theme before first paint to avoid a flash -->
  <script>
    (function () {
      let theme = "light";
      try {
        const raw = localStorage.getItem("iqb:theme");
        if (raw) theme = JSON.parse(raw);
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    })();
  </script>
</head>

<body>
  <!-- ===== splash =====
       Inline (not built by JS) so it paints on the first frame while the
       question data is still being fetched from the remote content repo.
       js/splash.js advances the bar from real fetch completions and removes
       this element once app.js has rendered. -->
  <div class="splash" id="splash" role="status" aria-live="polite" aria-busy="true">
    <div class="splash-brand">
      <div class="splash-logo" aria-hidden="true"></div>
      <h1 class="splash-title">interview<span>Deck</span></h1>
      <p class="splash-tagline">Your one-stop platform to prepare, practice and ace your interviews.</p>
    </div>

    <div class="splash-progress">
      <div class="splash-track" id="splash-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading progress">
        <div class="splash-bar" id="splash-bar"></div>
      </div>
      <p class="splash-status" id="splash-status">Loading your questions…</p>
      <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <div class="splash-art">
      <img src="assets/splash-illustration.webp" alt="" width="1041" height="375" fetchpriority="high" decoding="async" />
    </div>
  </div>

  <div class="app">
    <!-- ===== header ===== -->
    <div class="header-shell" id="header-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Interview Deck home">
          <!-- The mark carries the brand on mobile, where .brand-name is hidden
               to buy room for the control row. Painted as a CSS mask (see
               .brand-mark) so it takes the theme's accent rather than the
               artwork's fixed crimson. -->
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">interview<span>Deck</span></span>
        </a>

        <div class="header-spacer"></div>

        <label class="header-search" aria-label="Search questions">
          <span class="s-icon" aria-hidden="true" style="display: flex; align-items: center; justify-content: center;"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input class="js-search" type="search" placeholder="Search question" autocomplete="off" />
          <span class="s-kbd" aria-hidden="true">/</span>
        </label>
        <!-- mobile only: cancels and collapses the expanded search -->
        <button class="icon-btn search-close" id="search-close" type="button" aria-label="Close search">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>

        <!-- Global study-mode switch (sits by the search on the right). Prep =
             full answers/deep dives/code. Revise = crisp per-question recaps with
             a per-card Prep/Revise toggle. Persisted in localStorage (storage.js);
             text-only segmented control so the active mode is always visible. -->
        <div class="mode-switch" id="mode-switch" role="group" aria-label="Study mode">
          <button class="mode-opt is-active" id="mode-prep" type="button" aria-pressed="true" title="Learn mode — full answers, deep dives, code">Learn</button>
          <button class="mode-opt" id="mode-revise" type="button" aria-pressed="false" title="Revise mode — crisp recaps for a fast pre-interview refresh">Revise</button>
        </div>

        <!-- Focus pack: load a role-based subset of the bank (e.g. "Java +
             Angular"). Shown only when the content ships packs — app.js unhides
             it and opens the picker popover. -->
        <button class="icon-btn focus-btn" id="focus-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Focus pack" title="Focus pack — load role-specific questions" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </button>
        <!-- Playground. Used to ride the category tab strip (often scrolled off);
             fixed header spot with the other tools. Hidden under 640px —
             phones open it from the section dropdown. -->
        <button class="pg-header-btn" id="playground-btn" type="button" aria-label="Playground" title="JavaScript Playground">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
        <!-- mobile only. Sits in the sticky header (not the content head) so the
             filters stay reachable no matter how far the list is scrolled. The
             sheet it opens lives further down the DOM; it is position:fixed, so
             where the trigger sits does not matter. -->
        <button class="icon-btn filter-btn" id="filter-btn" type="button" aria-expanded="false" aria-controls="tools-panel" aria-label="Filters and tools">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <span class="filter-count" id="filter-count" hidden>0</span>
        </button>
        <!-- Quick Note. Lives in the sticky header so a note can be started at
             any scroll depth, and above the tutor panel so it stays reachable
             while a chat answer is on screen. Hidden under 640px (see
             css/quicknote.css) — the phone header already carries four targets. -->
        <!-- My Notes. Used to be the LAST tab of the scrollable category strip,
             where it lived permanently pushed off-screen — a personal space
             earns a fixed header spot instead. Hidden under 640px like Quick
             Note; phones reach it through the section dropdown. -->
        <button class="icon-btn mynotes-btn" id="mynotes-btn" type="button" aria-label="My Notes" title="My Notes — everything you've written">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
        </button>
        <button class="icon-btn qn-open-btn" id="quicknote-btn" type="button" aria-label="Quick note" aria-haspopup="dialog" title="Quick note (N)">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/><line x1="7" y1="8" x2="12" y2="8"/><line x1="7" y1="12" x2="11" y2="12"/><line x1="19" y1="3" x2="19" y2="9"/><line x1="22" y1="6" x2="16" y2="6"/></svg>
        </button>
        <button class="icon-btn" id="hl-toggle" type="button" aria-label="Highlighter" aria-haspopup="true" aria-expanded="false" title="Highlighter — pick a color, then select text to highlight">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
        </button>
        <!-- mobile only: expands .header-search across the header row -->
        <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Search questions" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <!-- desktop only: on mobile the theme switch lives in the tools sheet
             (#theme-toggle-m) so the header can hold four comfortable targets -->
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <!-- Profile / Sign In — far right, after tools (account menus open from here) -->
        <button class="auth-btn" id="auth-btn" type="button" aria-label="Sign in with Google to sync across devices">
          <span class="auth-btn-label">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Sign In
          </span>
          <span class="auth-btn-user" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 20v-1a6 6 0 0 1 12 0v1"/></svg>
          </span>
        </button>
      </header>

      <!-- category tabs (sticky within the header shell). The strip scrolls
           horizontally with its scrollbar hidden, which used to leave the
           overflowed tabs (My Notes!) undiscoverable — the arrows only render
           while there is actually something cut off on that side. -->
      <div class="tabs-wrap">
        <button class="tabs-arrow left" id="tabs-arrow-left" type="button" aria-label="Scroll tabs left" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Question categories"></nav>
        <button class="tabs-arrow right" id="tabs-arrow-right" type="button" aria-label="Scroll tabs right" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>

    <!-- mobile controls: compact dropdowns replacing the tab/topic/level chip rows (shown < 900px) -->
    <div class="mobile-controls" id="mobile-controls" role="group" aria-label="Filters">
      <div class="m-field"><select class="m-select" id="m-category" aria-label="Section"></select></div>
      <div class="m-field"><select class="m-select" id="m-topic" aria-label="Topic"></select></div>
      <div class="m-field"><select class="m-select" id="m-difficulty" aria-label="Level"></select></div>
    </div>

    <!-- ===== hero ===== -->

    <!-- ===== main ===== -->
    <main class="main">
      <aside class="sidebar" aria-label="Category navigation">
        <!-- desktop only: collapses the sidebar to a 56px icon rail. The AI
             Helper auto-collapses it on open (js/tutor.js), but this button
             lets the reader re-expand it — or collapse it any time. -->
        <button class="side-collapse" id="sidebar-collapse" type="button" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        </button>
        <nav id="sidebar-nav"></nav>
      </aside>

      <section class="content" aria-live="polite">
        <div class="content-head">
          <h2 class="content-title" id="content-title">All Questions</h2>

          <!-- The tools are NOT duplicated for mobile: .tools-panel is
               display:contents on desktop (so .content-tools is still a plain
               inline row) and becomes a bottom sheet under 900px. One set of
               buttons = one set of handlers in app.js. The sheet's trigger
               (#filter-btn) lives up in the sticky header.  -->
          <div class="tools-panel" id="tools-panel">
            <div class="tools-sheet-head">
              <span class="tools-sheet-title">Filters &amp; tools</span>
              <button class="tools-close" id="tools-close" type="button" aria-label="Close filters">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          <div class="content-tools">
            <button class="tool" id="bookmark-filter" type="button" title="Show bookmarked only">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Saved
            </button>
             <button class="tool" id="video-filter" type="button" title="Show questions with videos">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="#FF0000" style="flex-shrink: 0;" aria-hidden="true"><path d="M23.498 6.163a3.003 3.003 0 0 0-2.11-2.11C19.518 3.545 12 3.545 12 3.545s-7.518 0-9.388.508a3.003 3.003 0 0 0-2.11 2.11C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 0 0 2.11 2.11c1.87.508 9.388.508 9.388.508s7.518 0 9.388-.508a3.003 3.003 0 0 0 2.11-2.11C24 15.967 24 12 24 12s0-3.967-.502-5.837z"/><polygon points="9.545 8.568 9.545 15.432 15.545 12" fill="white"/></svg>
              With Videos
            </button>
            <button class="tool" id="completed-filter" type="button" title="Show completed only">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              Completed
            </button>
            <button class="tool" id="uncompleted-filter" type="button" title="Show uncompleted only">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
              Uncompleted
            </button>
            <button class="tool" id="note-filter" type="button" title="Show questions with notes">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>
              With Notes
            </button>
            <button class="tool" id="expand-all" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>
              Expand all
            </button>
            <button class="tool" id="collapse-all" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg>
              Collapse all
            </button>
            <!-- mobile only: the header has no room for the moon on a phone, so
                 the theme switch rides along with the tools. app.js keeps its
                 icon and label in sync with #theme-toggle. -->
            <!-- mobile only, same reasoning as the theme switch: the phone
                 header has no room for the Quick Note icon, but the panel
                 itself works fine there as a bottom sheet. -->
            <button class="tool tool-mobile-only" id="quicknote-btn-m" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/><line x1="7" y1="8" x2="12" y2="8"/><line x1="7" y1="12" x2="11" y2="12"/><line x1="19" y1="3" x2="19" y2="9"/><line x1="22" y1="6" x2="16" y2="6"/></svg>
              Quick Note
            </button>
            <!-- mobile only, same reasoning as Quick Note above: under 640px the header
                 has no room left (the avatar was getting pushed off), so the
                 highlighter's trigger moves into the sheet. highlights.js keeps it
                 in step with #hl-toggle and anchors the palette to a visible button. -->
            <button class="tool tool-mobile-only" id="hl-toggle-m" type="button" aria-haspopup="true" aria-expanded="false" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
              Highlighter
            </button>
            <button class="tool tool-theme" id="theme-toggle-m" type="button"></button>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>

            <div class="tools-sheet-foot">
              <button class="tools-clear" id="tools-clear" type="button">Clear</button>
              <button class="tools-done" id="tools-done" type="button">Apply</button>

       stroke-width="2"

    <path d="M21 15v4a2 2 0 0 1-2 2h-4"/>

  <!-- ===== app =====
       Questions live in a dedicated content repo (the single source of truth,
       shared with the Flutter app), served via jsDelivr. data-loader.js fetches
       the manifest + category JSON, populates IQB.data.<id>, then loads app.js. -->
  <script>
    window.IQB = { DATA_BASE:
      "https://raw.githubusercontent.com/chinmayannaik/interview-deck-questions/main/" };
    /* Dev only: preview unpushed content from the local sibling repo.
       In the console: localStorage.setItem("iqb:devDataBase", "questions-data/")
       then reload — scripts/devserver-api.mjs maps that path onto
       ../interview-deck-questions. Remove the key to go back to CDN content.
       Guarded to localhost so a copied snippet can never hijack production. */
    try {
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        var devBase = localStorage.getItem("iqb:devDataBase");
        if (devBase) window.IQB.DATA_BASE = devBase;
      }
    } catch (e) { /* storage unavailable — production path stands */ }
  </script>
  <script src="js/utils.js"></script>
  <!-- the app's own confirm()/prompt(). Early: notes, tags, reports and the
       rich-text toolbar all reach for it. -->
  <script src="js/dialog.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/select.js"></script>
  <script src="js/storage.js"></script>
  <!-- before data-loader.js: it drives the splash bar as its fetches land -->
  <script src="js/splash.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/sync.js"></script>
  <!-- shared syntax highlighter: the AI Tutor and My Notes both render code
       blocks with it, so it must load before either -->
  <script src="js/highlight.js"></script>
  <!-- AI Tutor: depends on IQB.cloud / IQB.sync from sync.js -->
  <script src="js/tutor.js"></script>
  <!-- My Notes. notebook.js (store + sync + migration) must precede both the
       view and notes.js, which is now just a card-shaped window onto it. -->
  <script src="js/notebook.js"></script>
  <script src="js/richtext.js"></script>
  <!-- before notebook-ui.js and quicknote.js: both build their tag control
       from it (My Notes with rename/delete, Quick Note without) -->
  <script src="js/tagpicker.js"></script>
  <script src="js/notebook-ui.js"></script>
  <script src="js/notes.js"></script>
  <!-- after notebook.js + richtext.js: the floating capture window writes
       straight into the notebook and reuses the same editor -->
  <script src="js/quicknote.js"></script>
  <!-- before highlights.js: the highlighter palette renders the pen's row -->
  <script src="js/inkpen.js"></script>
  <script src="js/highlights.js"></script>
  <!-- the code a reader wrote for a coding question. Same IQB.cloud layer as
       notes/highlights, so it must follow sync.js and precede coding.js -->
  <script src="js/solutions.js"></script>
  <!-- after sync.js (uses IQB.shared/IQB.cloud) and before app.js, which asks
       IQB.reports for each card's "Report Issue" button -->
  <script src="js/reports.js"></script>
  <!-- before app.js (injected by data-loader.js): buildCard() asks IQB.speak
       for each card's read-aloud button, and app.js hands back its openCard -->
  <script src="js/speak.js"></script>
  <!-- the shared JS editor + Web Worker sandbox. Must precede BOTH consumers:
       the Playground tab and the Solve IDE. -->
  <script src="js/codeedit.js"></script>
  <!-- before app.js (which data-loader.js injects): buildTabs() renders the
       Playground tab only if this has registered IQB.playground -->
  <script src="js/playground.js"></script>
  <!-- before app.js: buildCard() asks IQB.coding whether a question is
       solvable, and builds the problem-only card from it -->
  <script src="js/coding.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
