<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />

  <title>Interview Questions Bank — Angular, JavaScript, TypeScript &amp; Frontend</title>
  <meta name="description" content="A free, searchable bank of frontend interview questions and answers — Angular, JavaScript, TypeScript, RxJS, NgRx, HTML, CSS, Java, Spring Boot, SQL and Git. Practice mode, bookmarks and progress tracking." />
  <meta name="keywords" content="interview questions, angular interview, javascript interview, typescript, rxjs, ngrx, frontend interview, java, spring boot, sql, git" />
  <meta name="author" content="Interview Questions Bank" />
  <link rel="canonical" href="https://interview-questions-bank.netlify.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Interview Questions Bank" />
  <meta property="og:description" content="Master Angular, JavaScript, TypeScript and Frontend interviews,a searchable question bank with practice mode." />
  <meta property="og:url" content="https://interview-questions-bank.netlify.app/" />
  <meta property="og:image" content="assets/favicon/icon.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Interview Questions Bank" />
  <meta name="twitter:description" content="Master Angular, JavaScript, TypeScript and Frontend interviews." />
  <meta name="twitter:image" content="assets/favicon/icon.svg" />

  <!-- icons + manifest -->
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/favicon/icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#C21836" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141118" media="(prefers-color-scheme: dark)" />

  <!-- stylesheets (order matters: tokens → reset → components → theme) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dark-theme.css" />

  <!-- set theme before first paint to avoid a flash -->
  <script>
    (function () {
  const theme = localStorage.getItem("iqb:theme") || "light";
  document.documentElement.setAttribute(
    "data-theme",
    theme === "dark" ? "dark" : "light"
  );
})();
  </script>
</head>

<body>
  <div class="app">
    <!-- ===== header ===== -->
    <header class="site-header">
      <a class="brand" href="#frontend" aria-label="Interview Questions Bank home">
        <span class="brand-mark">IQ</span>
        <span class="brand-name">Interview <span>Bank</span></span>
      </a>
      <span class="header-count" id="header-count-slot" aria-hidden="true">Frontend &amp; more</span>
      <div class="header-spacer"></div>

      <label class="header-search" aria-label="Search questions">
        <span class="s-icon" aria-hidden="true">⌕</span>
        <input class="js-search" type="search" placeholder="Search question" autocomplete="off" />
        <span class="s-kbd" aria-hidden="true">/</span>
      </label>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button>
    </header>

    <!-- mobile search (shown < 900px) -->
    <div class="mobile-search">
      <label class="header-search" aria-label="Search questions">
        <span class="s-icon" aria-hidden="true">⌕</span>
        <input class="js-search" type="search" placeholder="Search questions" autocomplete="off" />
      </label>
    </div>

    <!-- ===== hero ===== -->

    <!-- ===== category tabs (sticky) ===== -->
    <div class="tabs-wrap">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Question categories"></nav>
    </div>

    <!-- ===== main ===== -->
    <main class="main">
      <aside class="sidebar" aria-label="Category navigation">
        <nav id="sidebar-nav"></nav>
      </aside>

      <section class="content" aria-live="polite">
        <div class="content-head">
          <h2 class="content-title" id="content-title">All Questions</h2>
          <div class="content-tools">
            <button class="tool" id="random-btn" type="button" title="Random question (R)">🎲 Random</button>
            <button class="tool" id="practice-toggle" type="button" title="Hide answers until revealed">🎯 Practice</button>
            <button class="tool" id="bookmark-filter" type="button" title="Show bookmarked only">★ Saved</button>
            <button class="tool" id="expand-all" type="button">Expand all</button>
            <button class="tool" id="collapse-all" type="button">Collapse all</button>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>
        </div>

        <!-- mobile/tablet topic selector (sidebar is hidden on small screens) -->
        <div class="subnav" id="subnav" role="tablist" aria-label="Topics"></div>

        <div class="filter-row" id="difficulty-filter"></div>

        <div class="q-list" id="q-list"></div>
      </section>
    </main>

    <!-- ===== footer ===== -->
  </div>

  <!-- ===== data (each file registers into window.IQB.data.<category>) ===== -->
  <script src="data/angular.js"></script>
  <script src="data/javascript.js"></script>
  <script src="data/typescript.js"></script>
  <script src="data/html.js"></script>
  <script src="data/css.js"></script>
  <script src="data/rxjs.js"></script>
  <script src="data/ngrx.js"></script>
  <script src="data/java.js"></script>
  <script src="data/springboot.js"></script>
  <script src="data/sql.js"></script>
  <script src="data/git.js"></script>
  <script src="data/general.js"></script>
  <script src="data/coding.js"></script>
  <script src="data/angular-coding.js"></script>
  <script src="data/testing.js"></script>
  <script src="data/behavioral.js"></script>

  <!-- ===== app ===== -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

  <!-- fill hero stats (kept tiny + inline so it runs after data loads) -->
  <script>
    (function () {
      var d = (window.IQB && IQB.data) || {};
      var total = 0, cats = 0;
      Object.keys(d).forEach(function (k) { if (Array.isArray(d[k]) && d[k].length) { total += d[k].length; cats++; } });
      var t = document.getElementById("stat-total"); if (t) t.textContent = total + "+";
      var c = document.getElementById("stat-cats"); if (c) c.textContent = cats;
      var hc = document.getElementById("header-count-slot"); if (hc) hc.textContent = total + " questions";
    })();
  </script>
</body>
</html>
